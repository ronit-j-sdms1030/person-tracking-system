<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Presence AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --border: #2a2f3d;
      --text: #e8eaf0;
      --text-muted: #7a8299;
      --accent: #4f7cff;
      --accent-glow: rgba(79, 124, 255, 0.25);
      --red: #ff4f6a;
      --input-bg: #1c2130;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background subtle grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,124,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,124,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 60px rgba(0,0,0,0.5), 0 0 60px var(--accent-glow);
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--accent);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input::placeholder {
      color: #3d4560;
    }

    .error-banner {
      background: rgba(255, 79, 106, 0.1);
      border: 1px solid rgba(255, 79, 106, 0.3);
      color: var(--red);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 18px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn:hover {
      background: #6b94ff;
      box-shadow: 0 6px 24px rgba(79,124,255,0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .hint strong {
      color: var(--text);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">👁️</div>
      <div class="logo-text">Presence<span>AI</span></div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to access the surveillance dashboard.</p>

    <div class="error-banner" id="error-banner">
      ⚠️ Incorrect username or password.
    </div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="submit-btn">Sign In</button>
    </form>

    <div class="divider"></div>
    <p class="hint">Default credentials: <strong>admin</strong> / <strong>password</strong></p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorBanner = document.getElementById('error-banner');

      btn.textContent = 'Signing in…';
      btn.classList.add('loading');
      btn.disabled = true;
      errorBanner.style.display = 'none';

      const formData = new FormData();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);

      try {
        const res = await fetch('/login', { method: 'POST', body: formData });
        if (res.ok) {
          window.location.href = '/';
        } else {
          errorBanner.style.display = 'block';
          btn.textContent = 'Sign In';
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      } catch (err) {
        errorBanner.textContent = '⚠️ Connection error. Is the server running?';
        errorBanner.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
