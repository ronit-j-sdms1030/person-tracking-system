<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CCTV Vision Tester — Person A</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #070b14;
    --surface:  #0d1424;
    --card:     rgba(255,255,255,0.04);
    --border:   rgba(255,255,255,0.08);
    --accent1:  #6c63ff;
    --accent2:  #00d4ff;
    --green:    #00e676;
    --red:      #ff5252;
    --amber:    #ffab40;
    --text:     #e8eaf0;
    --muted:    #7a8399;
    --radius:   14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,20,36,0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
  header span { font-size: 0.75rem; color: var(--muted); margin-left: 4px; }
  .badge {
    margin-left: auto;
    background: rgba(108,99,255,0.15);
    border: 1px solid rgba(108,99,255,0.3);
    color: var(--accent1);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
  }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 69px);
  }

  /* ── Upload / Controls panel (top strip) ── */
  .controls {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .upload-zone {
    flex: 1;
    min-width: 220px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px 22px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent1); background: rgba(108,99,255,0.08); }
  .upload-zone .icon { font-size: 22px; }
  .upload-zone p { font-size: 0.85rem; color: var(--muted); }
  .upload-zone p strong { color: var(--text); }
  #fileInput { display: none; }
  #fileName { font-size: 0.78rem; color: var(--accent2); font-family: 'JetBrains Mono', monospace; }

  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  select, input[type=text], input[type=number] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    min-width: 130px;
  }
  select:focus, input:focus { border-color: var(--accent1); }

  .btn {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 20px rgba(108,99,255,0.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.5); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-danger { background: rgba(255,82,82,0.15); border: 1px solid rgba(255,82,82,0.3); color: var(--red); }
  .btn-danger:hover { background: rgba(255,82,82,0.25); }

  /* ── Video panel ── */
  .video-panel {
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #videoFeed {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }
  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: var(--muted);
  }
  .placeholder .big-icon { font-size: 64px; opacity: 0.3; }
  .placeholder p { font-size: 0.9rem; }

  .progress-bar-wrap {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.05);
    display: none;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    width: 0%;
    transition: width 0.4s;
  }

  .status-chip {
    position: absolute;
    top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    backdrop-filter: blur(8px);
    display: none;
  }
  .status-chip.running {
    background: rgba(0,230,118,0.15);
    border: 1px solid rgba(0,230,118,0.3);
    color: var(--green);
    display: flex;
  }
  .status-chip.done {
    background: rgba(108,99,255,0.15);
    border: 1px solid var(--accent1);
    color: var(--accent1);
    display: flex;
  }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  /* ── Right panel ── */
  .right-panel {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Stats */
  .stats-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    transition: border-color 0.3s;
  }
  .stat-card.flash { border-color: var(--accent1); }
  .stat-card .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-card .value {
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.1;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--text), var(--muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-card.green .value { background: linear-gradient(135deg, var(--green), #69f0ae); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-card.red   .value { background: linear-gradient(135deg, var(--red),   #ff8a80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-card.amber .value { background: linear-gradient(135deg, var(--amber),  #ffe57f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .posture-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 0.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    gap: 8px;
  }
  .posture-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .posture-item .emoji { font-size: 18px; }
  .posture-item .pval { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .posture-item .plabel { font-size: 0.65rem; color: var(--muted); }

  /* Event log */
  .log-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
  }
  .log-count {
    background: rgba(108,99,255,0.15);
    color: var(--accent1);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  #eventLog {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #eventLog::-webkit-scrollbar { width: 4px; }
  #eventLog::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid transparent;
    font-size: 0.8rem;
    animation: slideIn 0.25s ease;
    background: var(--card);
  }
  @keyframes slideIn { from { opacity:0; transform: translateX(10px); } to { opacity:1; transform: translateX(0); } }
  .event-item.entered { border-color: rgba(0,230,118,0.25); background: rgba(0,230,118,0.05); }
  .event-item.exited  { border-color: rgba(255,82,82,0.25);  background: rgba(255,82,82,0.05); }
  .event-item.posture { border-color: rgba(0,212,255,0.25);  background: rgba(0,212,255,0.05); }
  .event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entered .event-dot { background: var(--green); }
  .exited  .event-dot { background: var(--red); }
  .posture .event-dot { background: var(--accent2); }
  .event-main { flex: 1; min-width: 0; }
  .event-type { font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; }
  .entered .event-type { color: var(--green); }
  .exited  .event-type { color: var(--red); }
  .posture .event-type { color: var(--accent2); }
  .event-meta { color: var(--muted); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; }
  .event-time { color: var(--muted); font-size: 0.68rem; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 36px; opacity: 0.3; }
  .empty-state p { font-size: 0.82rem; }
</style>
</head>

<body>
<header>
  <div class="logo">📷</div>
  <div>
    <h1>CCTV Vision Tester <span>— Person A</span></h1>
  </div>
  <div class="badge">YOLO11-pose · ByteTrack</div>
</header>

<main>
  <!-- Controls bar -->
  <div class="controls">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <span class="icon">📁</span>
      <div>
        <p><strong>Click or drag</strong> a video file to upload</p>
        <span id="fileName">No file selected</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="video/*"/>



    <div class="field-group">
      <label>Camera ID</label>
      <input type="text" id="cameraId" value="cam_test" placeholder="cam_door_1"/>
    </div>

    <div class="field-group">
      <label>Cooldown (s)</label>
      <input type="number" id="cooldown" value="2.0" step="0.5" min="0.5" style="min-width:80px"/>
    </div>

    <button class="btn btn-primary" id="runBtn" disabled>
      <span>▶</span> Run
    </button>
    <button class="btn btn-danger" id="stopBtn">
      <span>■</span> Stop
    </button>
  </div>

  <!-- Video panel -->
  <div class="video-panel">
    <div class="placeholder" id="placeholder">
      <div class="big-icon">🎥</div>
      <p>Upload a video and click Run to start</p>
    </div>
    <img id="videoFeed" src="" alt="Video feed"/>
    <div class="status-chip" id="statusChip">
      <div class="pulse"></div>
      <span id="statusText">Processing...</span>
    </div>
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">
    <div class="stats-section">
      <div class="section-title">Live Stats</div>

      <!-- Entry/Exit stats -->
      <div id="eeStats">
        <div class="stat-grid">
          <div class="stat-card green">
            <div class="label">Entered</div>
            <div class="value" id="statEntered">0</div>
          </div>
          <div class="stat-card red">
            <div class="label">Exited</div>
            <div class="value" id="statExited">0</div>
          </div>
        </div>
      </div>

      <!-- Posture stats -->
      <div id="postureStats">
        <div class="posture-row">
          <div class="posture-item">
            <div class="emoji">🧍</div>
            <div class="pval" id="statStanding">0</div>
            <div class="plabel">Standing</div>
          </div>
          <div class="posture-item">
            <div class="emoji">🪑</div>
            <div class="pval" id="statSitting">0</div>
            <div class="plabel">Sitting</div>
          </div>
          <div class="posture-item">
            <div class="emoji">❓</div>
            <div class="pval" id="statUnknown">0</div>
            <div class="plabel">Unknown</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Event log -->
    <div class="log-section">
      <div class="log-header">
        <div class="section-title" style="margin:0">Event Log</div>
        <div class="log-count" id="logCount">0 events</div>
      </div>
      <div id="eventLog">
        <div class="empty-state" id="emptyState">
          <div class="icon">📋</div>
          <p>Events will appear here</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const fileInput   = document.getElementById('fileInput');
  const uploadZone  = document.getElementById('uploadZone');
  const fileName    = document.getElementById('fileName');
  const runBtn      = document.getElementById('runBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const roleSelect  = document.getElementById('roleSelect');
  const videoFeed   = document.getElementById('videoFeed');
  const placeholder = document.getElementById('placeholder');
  const statusChip  = document.getElementById('statusChip');
  const statusText  = document.getElementById('statusText');
  const eventLog    = document.getElementById('eventLog');
  const emptyState  = document.getElementById('emptyState');
  const logCount    = document.getElementById('logCount');
  const eeStats     = document.getElementById('eeStats');
  const postureStats= document.getElementById('postureStats');

  let selectedFile  = null;
  let eventSource   = null;
  let totalEvents   = 0;



  // ── Drag and Drop ────────────────────────────────────────────────────────
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(f) {
    selectedFile = f;
    fileName.textContent = f.name;
    runBtn.disabled = false;
  }

  // ── Run ──────────────────────────────────────────────────────────────────
  runBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    // Reset UI
    totalEvents = 0;
    logCount.textContent = '0 events';
    eventLog.innerHTML = '';
    document.getElementById('statEntered').textContent = '0';
    document.getElementById('statExited').textContent  = '0';
    document.getElementById('statStanding').textContent = '0';
    document.getElementById('statSitting').textContent  = '0';
    document.getElementById('statUnknown').textContent  = '0';

    const fd = new FormData();
    fd.append('video',     selectedFile);
    fd.append('role',      'both');
    fd.append('camera_id', document.getElementById('cameraId').value);
    fd.append('cooldown',  document.getElementById('cooldown').value);

    const res = await fetch('/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    // Show video feed
    placeholder.style.display = 'none';
    videoFeed.style.display   = 'block';
    videoFeed.src = '/video_feed?' + Date.now();

    // Status chip
    statusChip.className = 'status-chip running';
    statusText.textContent = 'Processing…';

    // Start SSE
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/event_stream');
    eventSource.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'ping') return;
      if (msg.type === 'event') {
        if (msg.data) addEventItem(msg.data);
        updateStats(msg.stats);
      }
      if (msg.type === 'done') {
        statusChip.className = 'status-chip done';
        statusText.textContent = '✓ Done';
        eventSource.close();
      }
      if (msg.type === 'error') {
        statusChip.className = 'status-chip done';
        statusText.textContent = '✗ ' + msg.message;
      }
    };
  });

  // ── Stop ─────────────────────────────────────────────────────────────────
  stopBtn.addEventListener('click', async () => {
    await fetch('/stop', { method: 'POST' });
    if (eventSource) eventSource.close();
    statusChip.className = 'status-chip done';
    statusText.textContent = '■ Stopped';
    videoFeed.src = '';
  });

  // ── Add event to log ──────────────────────────────────────────────────────
  function addEventItem(ev) {
    // Remove empty state
    if (emptyState.parentNode === eventLog) eventLog.removeChild(emptyState);

    totalEvents++;
    logCount.textContent = totalEvents + ' event' + (totalEvents !== 1 ? 's' : '');

    const cls  = ev.event === 'entered' ? 'entered' :
                 ev.event === 'exited'  ? 'exited'  : 'posture';
    const type = ev.event ? ev.event.toUpperCase() :
                 (ev.posture ? ev.posture.toUpperCase() : '');
    const meta = `ID:${ev.track_id} · ${ev.camera_id}`;

    const div = document.createElement('div');
    div.className = `event-item ${cls}`;
    div.innerHTML = `
      <div class="event-dot"></div>
      <div class="event-main">
        <div class="event-type">${type}</div>
        <div class="event-meta">${meta}</div>
      </div>
      <div class="event-time">${ev.time}</div>
    `;
    eventLog.prepend(div);

    // Keep max 200 items
    while (eventLog.children.length > 200) eventLog.removeChild(eventLog.lastChild);
  }

  // ── Update stats ──────────────────────────────────────────────────────────
  function updateStats(stats) {
    if (stats.entered !== undefined) {
      animateValue('statEntered', parseInt(document.getElementById('statEntered').textContent), stats.entered);
      animateValue('statExited',  parseInt(document.getElementById('statExited').textContent),  stats.exited);
    }
    if (stats.posture) {
      document.getElementById('statStanding').textContent = stats.posture.standing || 0;
      document.getElementById('statSitting').textContent  = stats.posture.sitting  || 0;
      document.getElementById('statUnknown').textContent  = stats.posture.unknown  || 0;
    }
  }

  function animateValue(id, from, to) {
    const el = document.getElementById(id);
    if (from === to) return;
    el.textContent = to;
    el.closest('.stat-card').classList.add('flash');
    setTimeout(() => el.closest('.stat-card').classList.remove('flash'), 400);
  }
</script>
</body>
</html>
