<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV People Counting Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e0e0e0;
        }
        #zones-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .zone-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .zone-title {
            margin-top: 0;
            font-size: 1.5em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #4db8ff;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1em;
        }
        .metric-label {
            color: #aaa;
        }
        .metric-val {
            font-weight: bold;
        }
        .util-bar-bg {
            background-color: #333;
            height: 10px;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }
        .util-bar-fill {
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .status-indicator {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>People Counting Dashboard</h1>
    <div class="status-indicator" id="connection-status">Connecting...</div>
    <div id="zones-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
